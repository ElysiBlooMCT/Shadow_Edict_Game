# Tự build 4 bản (Android, Windows, macOS, Linux) và đăng lên mục Releases của GitHub.
# Kích hoạt: đẩy một tag dạng v1.5.1 (git tag v1.5.1 && git push origin v1.5.1),
#            hoặc bấm "Run workflow" trong tab Actions (chỉ build, không tạo Release).
name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # cần để tạo Release và đính kèm file

env:
  # JDK 21 bản mới nhất của Temurin (construo tự tải JDK riêng để đóng gói nên không cần khớp từng bản vá)
  JAVA_VERSION: '21'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then NAME="${GITHUB_REF#refs/tags/v}"; else NAME="0.0.0-dev.${GITHUB_RUN_NUMBER}"; fi
          # versionCode phải luôn tăng: lấy số lần chạy workflow + 100 (lớn hơn các bản build tay trước đây)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Giải mã khóa ký APK từ GitHub Secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Chưa có secret ANDROID_KEYSTORE_BASE64 -> APK được ký bằng khóa debug tạm, người chơi sẽ KHÔNG cập nhật đè được lên bản sau."
          fi
      - name: Build APK + AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --console=plain android:assembleRelease android:bundleRelease \
            -PreleaseVersion=${{ needs.version.outputs.name }} -PreleaseCode=${{ needs.version.outputs.code }}
          mkdir -p dist
          cp android/build/outputs/apk/release/*.apk "dist/ShadowEdict-${{ needs.version.outputs.name }}-android.apk"
          cp android/build/outputs/bundle/release/*.aab "dist/ShadowEdict-${{ needs.version.outputs.name }}-android.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  desktop:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Đóng gói Windows / macOS (Apple Silicon + Intel) / Linux kèm sẵn Java
        run: |
          chmod +x gradlew
          ./gradlew --console=plain -PprojectVersion=${{ needs.version.outputs.name }} \
            lwjgl3:packageWinX64 lwjgl3:packageLinuxX64 lwjgl3:packageMacM1 lwjgl3:packageMacX64 lwjgl3:jar
          mkdir -p dist
          V=${{ needs.version.outputs.name }}
          for t in WinX64:windows-x64 LinuxX64:linux-x64 MacM1:macos-apple-silicon MacX64:macos-intel; do
            src=$(ls lwjgl3/build/construo/dist/*${t%%:*}*.zip 2>/dev/null | head -1)
            [ -z "$src" ] && src=$(ls lwjgl3/build/construo/dist/*$(echo ${t%%:*} | tr 'A-Z' 'a-z')*.zip 2>/dev/null | head -1)
            [ -n "$src" ] && cp "$src" "dist/ShadowEdict-$V-${t##*:}.zip" || echo "::warning::Không thấy gói ${t%%:*}"
          done
          # Bản JAR chạy mọi hệ điều hành (cần cài Java 11+): dự phòng nếu bản đóng gói gặp lỗi
          cp lwjgl3/build/libs/*.jar "dist/ShadowEdict-$V-all-platforms.jar"
          ls -la dist lwjgl3/build/construo/dist || true
      - uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: "Shadow Edict: Ám Lệnh ${{ needs.version.outputs.name }}"
          generate_release_notes: true
          files: dist/*
