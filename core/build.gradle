[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

dependencies {
  implementation 'io.socket:socket.io-client:2.1.0'
  api "com.badlogicgames.gdx:gdx-box2d:$gdxVersion"
  api "com.badlogicgames.gdx:gdx:$gdxVersion"

  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }
}

jar {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Sinh class BuildInfo.VERSION tu projectVersion (gradle.properties, hoac -PprojectVersion=... khi CI build)
// -> so phien ban trong game, APK va Release luon khop nhau, chi can sua 1 cho duy nhat.
def buildInfoDir = layout.buildDirectory.dir('generated/sources/buildinfo/java')
def buildInfoVersion = providers.gradleProperty('projectVersion').orElse('dev')
def generateBuildInfo = tasks.register('generateBuildInfo') {
  def outDir = buildInfoDir
  def ver = buildInfoVersion
  inputs.property('version', ver)
  outputs.dir(outDir)
  doLast {
    def f = outDir.get().file('io/qzz/elysibloomct/ctv/se/BuildInfo.java').asFile
    f.parentFile.mkdirs()
    f.setText("package io.qzz.elysibloomct.ctv.se;\n\n/** Generated from projectVersion. Do not edit. */\npublic final class BuildInfo {\n    public static final String VERSION = \"" + ver.get() + "\";\n    private BuildInfo() {}\n}\n", 'UTF-8')
  }
}
sourceSets.main.java.srcDir(generateBuildInfo)
